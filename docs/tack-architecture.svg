<svg viewBox="0 0 1950 1000" xmlns="http://www.w3.org/2000/svg" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrowRose" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#be123c"/>
    </marker>
    <marker id="arrowIndigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4f46e5"/>
    </marker>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1950" height="1000" fill="#ffffff"/>

  <!-- Title -->
  <text x="975" y="40" text-anchor="middle" font-size="26" font-weight="700" fill="#1e293b">Tack Platform — Backend Architecture</text>
  <text x="975" y="63" text-anchor="middle" font-size="14" fill="#64748b">How tack-server, tack-indexer, tack-hocuspocus, Postgres, and OpenSearch fit together</text>

  <!-- ══════════════════ WS lane: Tack Frontend -> tack-hocuspocus, routed above everything ══════════════════ -->
  <path d="M230,116 L230,90 L1390,90 L1390,116" fill="none" stroke="#4f46e5" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrowIndigo)"/>
  <text x="810" y="83" text-anchor="middle" font-size="11.5" fill="#4f46e5">WebSocket (Yjs sync) — while collaboratively editing a Page</text>

  <!-- ══════════════════ Row 1: Clients ══════════════════ -->
  <text x="60" y="104" font-size="13" font-weight="700" fill="#94a3b8" letter-spacing="1.5">CLIENTS</text>

  <rect x="60" y="116" width="340" height="82" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="230" y="148" text-anchor="middle" font-size="16" font-weight="700" fill="#1e293b">Tack</text>
  <text x="230" y="168" text-anchor="middle" font-size="12.5" fill="#64748b">Next.js frontend · :3010</text>
  <text x="230" y="185" text-anchor="middle" font-size="11.5" fill="#94a3b8">Notes + Pages UI</text>

  <rect x="440" y="116" width="460" height="82" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="670" y="148" text-anchor="middle" font-size="16" font-weight="700" fill="#1e293b">Other Ullav apps</text>
  <text x="670" y="168" text-anchor="middle" font-size="12.5" fill="#64748b">cunav · togra · lagan · awe-client · cartlann</text>
  <text x="670" y="185" text-anchor="middle" font-size="11.5" fill="#94a3b8">embed @ullav-dev/tack-notes, call the REST API directly</text>

  <rect x="940" y="116" width="300" height="82" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="1090" y="148" text-anchor="middle" font-size="16" font-weight="700" fill="#1e293b">MCP clients</text>
  <text x="1090" y="168" text-anchor="middle" font-size="12.5" fill="#64748b">Claude Code / Claude Desktop, etc.</text>
  <text x="1090" y="185" text-anchor="middle" font-size="11.5" fill="#94a3b8">agentic tool calls</text>

  <!-- Client -> tack-server, straight verticals + one clean diagonal -->
  <path d="M230,198 L230,250" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="240" y="228" font-size="11.5" fill="#475569">REST</text>

  <path d="M670,198 L670,222 L500,222 L500,250" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="530" y="215" font-size="11.5" fill="#475569">REST</text>

  <path d="M1090,198 L1090,222 L900,222 L900,250" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="960" y="215" font-size="11.5" fill="#475569">MCP</text>

  <!-- ══════════════════ Row 2: Application layer ══════════════════ -->
  <text x="60" y="238" font-size="13" font-weight="700" fill="#94a3b8" letter-spacing="1.5">APPLICATION LAYER</text>

  <!-- tack-server -->
  <rect x="60" y="250" width="1080" height="252" rx="12" fill="#fff1f2" stroke="#be123c" stroke-width="2.5"/>
  <text x="90" y="282" font-size="18" font-weight="700" fill="#9f1239">tack-server</text>
  <text x="90" y="302" font-size="12.5" fill="#be123c">Rust · axum · :8087</text>

  <rect x="90" y="320" width="460" height="162" rx="8" fill="#ffffff" stroke="#fda4af" stroke-width="1.5"/>
  <text x="320" y="346" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">REST API</text>
  <text x="320" y="367" text-anchor="middle" font-size="11.5" fill="#64748b">Notes · Pages · Spaces · Note Folders</text>
  <text x="320" y="384" text-anchor="middle" font-size="11.5" fill="#64748b">Idea Boards · System Principals · Search</text>
  <text x="320" y="410" text-anchor="middle" font-size="11" fill="#94a3b8">Live ACL: notes_acl.rs / pages_acl.rs</text>
  <text x="320" y="427" text-anchor="middle" font-size="11" fill="#94a3b8">private / team / organization — resolved</text>
  <text x="320" y="444" text-anchor="middle" font-size="11" fill="#94a3b8">every request, never denormalized</text>
  <text x="320" y="466" text-anchor="middle" font-size="11" fill="#94a3b8">Every write enqueues an outbox_events row</text>

  <rect x="570" y="320" width="230" height="162" rx="8" fill="#ffffff" stroke="#fda4af" stroke-width="1.5"/>
  <text x="685" y="346" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">MCP Server</text>
  <text x="685" y="367" text-anchor="middle" font-size="11.5" fill="#64748b">/mcp · rmcp</text>
  <text x="685" y="393" text-anchor="middle" font-size="11" fill="#94a3b8">search_content</text>
  <text x="685" y="410" text-anchor="middle" font-size="11" fill="#94a3b8">get_note_thread</text>
  <text x="685" y="427" text-anchor="middle" font-size="11" fill="#94a3b8">create_note</text>
  <text x="685" y="444" text-anchor="middle" font-size="11" fill="#94a3b8">reply_to_note</text>
  <text x="685" y="466" text-anchor="middle" font-size="10.5" fill="#94a3b8">same ACL as REST</text>

  <rect x="820" y="320" width="300" height="162" rx="8" fill="#ffffff" stroke="#fda4af" stroke-width="1.5"/>
  <text x="970" y="346" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">Auth</text>
  <text x="970" y="367" text-anchor="middle" font-size="11.5" fill="#64748b">TackUser extractor</text>
  <text x="970" y="393" text-anchor="middle" font-size="11" fill="#94a3b8">decodes JWT, enforces the</text>
  <text x="970" y="410" text-anchor="middle" font-size="11" fill="#94a3b8">team-granted "tack" product gate</text>
  <text x="970" y="427" text-anchor="middle" font-size="11" fill="#94a3b8">shared identically by REST + MCP</text>
  <text x="970" y="449" text-anchor="middle" font-size="10.5" fill="#94a3b8" font-style="italic">(so notes_acl / pages_acl can never</text>
  <text x="970" y="464" text-anchor="middle" font-size="10.5" fill="#94a3b8" font-style="italic">drift between the two transports)</text>

  <!-- tack-hocuspocus -->
  <rect x="1180" y="250" width="420" height="252" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="2.5"/>
  <text x="1210" y="282" font-size="18" font-weight="700" fill="#3730a3">tack-hocuspocus</text>
  <text x="1210" y="302" font-size="12.5" fill="#4f46e5">Node / TypeScript · :8088</text>
  <text x="1210" y="328" font-size="12.5" fill="#4338ca" font-weight="600">Real-time Yjs sync for Pages</text>
  <text x="1210" y="349" font-size="11.5" fill="#64748b">@hocuspocus/server — TipTap's own</text>
  <text x="1210" y="365" font-size="11.5" fill="#64748b">reference sync server, not reimplemented</text>
  <text x="1210" y="393" font-size="11.5" fill="#64748b">Auth is delegated, never reimplemented:</text>
  <text x="1210" y="409" font-size="11.5" fill="#64748b">forwards the caller's own token to</text>
  <text x="1210" y="425" font-size="11.5" fill="#64748b">tack-server on every connection (left)</text>
  <text x="1210" y="450" font-size="11.5" fill="#64748b">Derives content_markdown from the Yjs</text>
  <text x="1210" y="466" font-size="11.5" fill="#64748b">doc on every save (onStoreDocument)</text>
  <text x="1210" y="488" font-size="10.5" fill="#94a3b8" font-style="italic">writes page_docs.yjs_doc_state directly (below)</text>

  <!-- hocuspocus -> tack-server: short, same-row, no bend needed -->
  <path d="M1180,340 L1140,340" fill="none" stroke="#4f46e5" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrowIndigo)"/>
  <text x="1160" y="331" font-size="9.5" fill="#4f46e5" text-anchor="middle">permission</text>
  <text x="1160" y="356" font-size="9.5" fill="#4f46e5" text-anchor="middle">check</text>

  <!-- ullav-user-management (external), its own column, same row -->
  <rect x="1640" y="250" width="250" height="252" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="1765" y="286" text-anchor="middle" font-size="16" font-weight="700" fill="#475569">ullav-user-</text>
  <text x="1765" y="306" text-anchor="middle" font-size="16" font-weight="700" fill="#475569">management</text>
  <text x="1765" y="328" text-anchor="middle" font-size="11.5" fill="#64748b">external service · :8081</text>
  <text x="1765" y="360" text-anchor="middle" font-size="11.5" fill="#94a3b8">JWT issuer + JWKS</text>
  <text x="1765" y="380" text-anchor="middle" font-size="11.5" fill="#94a3b8">teams, organizations,</text>
  <text x="1765" y="397" text-anchor="middle" font-size="11.5" fill="#94a3b8">product gates</text>
  <text x="1765" y="425" text-anchor="middle" font-size="10.5" fill="#94a3b8" font-style="italic">trusted by every first-party</text>
  <text x="1765" y="441" text-anchor="middle" font-size="10.5" fill="#94a3b8" font-style="italic">Ullav service, not just Tack</text>

  <!-- ══════════════════ Row 2 → Row 3: three stacked orthogonal lanes, top to bottom ══════════════════ -->
  <!-- Lane A y=522: tack-server Auth -> ullav-user-management -->
  <path d="M970,502 L970,522 L1765,522 L1765,502" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1370" y="514" text-anchor="middle" font-size="11" fill="#475569">validate JWT (JWKS) · resolve caller's teams/orgs</text>

  <!-- Lane B y=555: tack-server -> OpenSearch (search reads) -->
  <path d="M760,502 L760,555 L1210,555 L1210,650" fill="none" stroke="#be123c" stroke-width="2" marker-end="url(#arrowRose)"/>
  <text x="1030" y="547" text-anchor="middle" font-size="11" fill="#be123c">GET /search — hybrid query, ACL-filtered</text>

  <!-- Lane C y=588: tack-hocuspocus -> Postgres (direct) -->
  <path d="M1300,502 L1300,588 L270,588 L270,650" fill="none" stroke="#4f46e5" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrowIndigo)"/>
  <text x="800" y="580" text-anchor="middle" font-size="11" fill="#4f46e5">direct read/write — page_docs.yjs_doc_state</text>
  <text x="800" y="602" text-anchor="middle" font-size="10" fill="#94a3b8">(bypasses tack-server; mirrors tack-indexer's own direct-DB access, below)</text>

  <!-- tack-server -> Postgres, short + direct -->
  <path d="M400,502 L400,650" fill="none" stroke="#be123c" stroke-width="2" marker-end="url(#arrowRose)"/>
  <text x="410" y="625" font-size="11" fill="#be123c">read / write</text>

  <!-- ══════════════════ Row 3: Data + async worker ══════════════════ -->
  <text x="60" y="638" font-size="13" font-weight="700" fill="#94a3b8" letter-spacing="1.5">DATA &amp; ASYNC INDEXING</text>

  <!-- Postgres -->
  <path d="M60,678 a210,16 0 0 1 420,0 v150 a210,16 0 0 1 -420,0 z" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2.5"/>
  <ellipse cx="270" cy="678" rx="210" ry="16" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2.5"/>
  <text x="270" y="684" text-anchor="middle" font-size="16" font-weight="700" fill="#1e3a8a">Postgres</text>
  <text x="270" y="722" text-anchor="middle" font-size="12" fill="#334155" font-weight="600">source of truth · raw SQL, no ORM</text>
  <text x="270" y="743" text-anchor="middle" font-size="11" fill="#334155">hash-partitioned by</text>
  <text x="270" y="759" text-anchor="middle" font-size="11" fill="#334155">organization_id (32 buckets)</text>
  <text x="270" y="781" text-anchor="middle" font-size="10.5" fill="#334155">Notes · Pages · Spaces · Folders</text>
  <text x="270" y="797" text-anchor="middle" font-size="10.5" fill="#334155">Permissions · Revisions · Links</text>
  <text x="270" y="818" text-anchor="middle" font-size="10.5" fill="#1e40af" font-weight="700">outbox_events</text>
  <text x="270" y="833" text-anchor="middle" font-size="9.5" fill="#334155">every write enqueues here, same txn</text>

  <!-- tack-indexer -->
  <rect x="540" y="662" width="400" height="182" rx="12" fill="#fef2f2" stroke="#be123c" stroke-width="2" stroke-dasharray="7,4"/>
  <text x="740" y="694" text-anchor="middle" font-size="16" font-weight="700" fill="#9f1239">tack-indexer</text>
  <text x="740" y="714" text-anchor="middle" font-size="11.5" fill="#64748b">separate Rust binary, same crate as tack-server</text>
  <text x="740" y="731" text-anchor="middle" font-size="11.5" fill="#64748b">own container/process — isolates indexing load</text>
  <text x="740" y="758" text-anchor="middle" font-size="11.5" fill="#475569" font-weight="600">drains outbox_events</text>
  <text x="740" y="775" text-anchor="middle" font-size="10.5" fill="#94a3b8">SELECT ... FOR UPDATE SKIP LOCKED · 2s poll</text>
  <text x="740" y="801" text-anchor="middle" font-size="11.5" fill="#475569" font-weight="600">local embeddings</text>
  <text x="740" y="818" text-anchor="middle" font-size="10.5" fill="#94a3b8">fastembed · multilingual-e5-small (ONNX, self-hosted)</text>
  <text x="740" y="834" text-anchor="middle" font-size="10.5" fill="#94a3b8">chunks long text: 400 words, 50-word overlap</text>

  <!-- OpenSearch -->
  <path d="M1000,678 a210,16 0 0 1 420,0 v150 a210,16 0 0 1 -420,0 z" fill="#f0fdfa" stroke="#0d9488" stroke-width="2.5"/>
  <ellipse cx="1210" cy="678" rx="210" ry="16" fill="#ccfbf1" stroke="#0d9488" stroke-width="2.5"/>
  <text x="1210" y="684" text-anchor="middle" font-size="16" font-weight="700" fill="#134e4a">OpenSearch</text>
  <text x="1210" y="722" text-anchor="middle" font-size="12" fill="#334155" font-weight="600">secondary, rebuildable index</text>
  <text x="1210" y="744" text-anchor="middle" font-size="10.5" fill="#334155">hybrid search: BM25 (lexical)</text>
  <text x="1210" y="760" text-anchor="middle" font-size="10.5" fill="#334155">+ kNN (semantic), fused via RRF</text>
  <text x="1210" y="783" text-anchor="middle" font-size="10.5" fill="#0f766e" font-weight="700">ACL enforced *in* the query itself,</text>
  <text x="1210" y="799" text-anchor="middle" font-size="10.5" fill="#0f766e" font-weight="700">not filtered after the fact</text>
  <text x="1210" y="820" text-anchor="middle" font-size="9.5" fill="#334155">index mapping: title, text (chunked),</text>
  <text x="1210" y="834" text-anchor="middle" font-size="9.5" fill="#334155">folder_id / space_id, embedding vector</text>

  <!-- Postgres -> tack-indexer -->
  <path d="M480,753 L540,753" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="510" y="745" text-anchor="middle" font-size="10.5" fill="#475569">drain</text>

  <!-- tack-indexer -> OpenSearch -->
  <path d="M940,753 L1000,753" fill="none" stroke="#0d9488" stroke-width="2" marker-end="url(#arrowTeal)"/>
  <text x="970" y="745" text-anchor="middle" font-size="9.5" fill="#0d9488">index/delete</text>

  <!-- ══════════════════ Legend ══════════════════ -->
  <g transform="translate(60, 918)">
    <text x="0" y="0" font-size="13" font-weight="700" fill="#94a3b8" letter-spacing="1.5">LEGEND</text>

    <rect x="0" y="14" width="22" height="16" rx="3" fill="#fff1f2" stroke="#be123c" stroke-width="2"/>
    <text x="30" y="27" font-size="12.5" fill="#334155">Rust service (tack-server / tack-indexer)</text>

    <rect x="360" y="14" width="22" height="16" rx="3" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
    <text x="390" y="27" font-size="12.5" fill="#334155">Node/TS service (tack-hocuspocus)</text>

    <rect x="690" y="14" width="22" height="16" rx="3" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
    <text x="720" y="27" font-size="12.5" fill="#334155">Data store — source of truth</text>

    <rect x="960" y="14" width="22" height="16" rx="3" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/>
    <text x="990" y="27" font-size="12.5" fill="#334155">Data store — rebuildable index</text>

    <rect x="1230" y="14" width="22" height="16" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4,3"/>
    <text x="1260" y="27" font-size="12.5" fill="#334155">External service</text>

    <line x1="1470" y1="22" x2="1500" y2="22" stroke="#4f46e5" stroke-width="2" stroke-dasharray="5,4"/>
    <text x="1508" y="27" font-size="12.5" fill="#334155">Direct / delegated path (bypasses the usual layer)</text>
  </g>
</svg>
