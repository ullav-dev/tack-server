name: Package cleanup

on:
  schedule:
    - cron: "0 6 * * 1"   # weekly, Monday 06:00 UTC
  workflow_dispatch: {}    # manual trigger, for testing the policy

jobs:
  cleanup:
    uses: ullav-dev/.github/.github/workflows/package-cleanup.yml@main
    with:
      # This repo publishes both tack-server and tack-indexer (a second
      # src/bin/ binary sharing this crate's lib code, not a separate repo).
      packages: "tack-server,tack-indexer"
    permissions:
      packages: write
