name: build_deploy

on:
  push:
    branches: main
    paths:
      - 'src/**'
      - 'migrations/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'Dockerfile'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Checkout ullav-mcp-auth (path dependency)
        uses: actions/checkout@v6
        with:
          repository: ullav-dev/ullav-mcp-auth
          token: ${{ secrets.PAT_CLASSIC }}
          path: ullav-mcp-auth
      - name: Symlink ullav-mcp-auth at Cargo's expected sibling path
        run: ln -s ${{ github.workspace }}/ullav-mcp-auth ${{ github.workspace }}/../ullav-mcp-auth
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
      - name: Run tests
        run: cargo test

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Checkout ullav-mcp-auth (path dependency)
        uses: actions/checkout@v6
        with:
          repository: ullav-dev/ullav-mcp-auth
          token: ${{ secrets.PAT_CLASSIC }}
          path: ullav-mcp-auth
      - name: Get commit hash
        id: commit
        run: echo "short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.PAT_CLASSIC }}
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/ullav-dev/tack-server:${{ steps.commit.outputs.short }}
            ghcr.io/ullav-dev/tack-server:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
